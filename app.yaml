apiVersion: v1
kind: Namespace
metadata:
  name: cat
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-js
  namespace: cat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-js
  template:
    metadata:
      labels:
        app: app-js
    spec:
      containers:
        - name: app
          image: mikesir87/cats:1.0
          #imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: app-js-config
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: app-js
  namespace: cat
spec:
  type: NodePort
  selector:
    app: app-js
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30082

---      
