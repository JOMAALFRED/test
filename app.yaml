apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cats-ingress
  namespace: cat
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cats.local
      secretName: cats-tls
  rules:
    - host: cats.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-js
                port:
                  number: 5000


